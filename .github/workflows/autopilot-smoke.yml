name: Autopilot end-to-end smoke test

# Runs scripts/verify-autopilot.sh against the Vercel preview deploy for the
# current SHA on the feat/forge-v2-cutover branch. This is the P3.10 gate
# from AUTOPILOT-RELIABILITY-SYNTHESIS.md.
#
# Cost awareness: each run hits OpenAI / DeepSeek / Anthropic tokens plus
# image renders, estimated £2-3 per run. Scoped to the autopilot branch +
# PRs into main, and skipped on docs-only changes via the paths-ignore
# filter below. Manual re-runs are allowed via workflow_dispatch.

on:
  push:
    branches:
      - feat/forge-v2-cutover
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/workflows/README.md"
      - "AUTOPILOT-RELIABILITY-*.md"
      - "RED-TEAM-*.md"
      - "HANDOVER-*.md"
      - "MEMORY.md"
      - "CLAUDE.md"
      - ".gitignore"
      - "LICENSE"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      preview_url_override:
        description: "Preview URL to run against (leave blank to auto-detect the latest Vercel preview for this SHA)"
        required: false
        type: string
      subject_override:
        description: "Brief subject to use (leave blank for the default BESS smoke brief)"
        required: false
        type: string

# Only one smoke run in flight per branch. Newer pushes cancel older runs so
# we never pay for two runs on the same SHA.
concurrency:
  group: autopilot-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Autopilot smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      FORGEOS_TEST_EMAIL: ${{ secrets.FORGEOS_TEST_EMAIL }}
      FORGEOS_TEST_PASSWORD: ${{ secrets.FORGEOS_TEST_PASSWORD }}
      SMOKE_SUBJECT_DEFAULT: "Grid-scale battery storage system for a 2 MW / 4 MWh site"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fail fast if required secrets are missing
        run: |
          MISSING=""
          for var in VERCEL_TOKEN SUPABASE_SERVICE_ROLE_KEY SUPABASE_URL \
                     SUPABASE_PROJECT_REF FORGEOS_TEST_EMAIL FORGEOS_TEST_PASSWORD; do
            if [ -z "${!var}" ]; then
              MISSING="$MISSING $var"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Missing required GitHub secrets:$MISSING"
            echo "See .github/workflows/README.md for the full list of required secrets."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install poppler-utils (pdfinfo + pdftotext)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install agent-browser
        run: |
          npm install -g agent-browser
          agent-browser install

      - name: Resolve preview URL for current SHA
        id: preview
        shell: bash
        env:
          OVERRIDE: ${{ github.event.inputs.preview_url_override }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ -n "${OVERRIDE:-}" ]; then
            echo "Using override preview URL: $OVERRIDE"
            echo "preview_url=$OVERRIDE" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SHORT_SHA="${SHA:0:7}"
          DEADLINE=$(( $(date +%s) + 600 ))  # 10 minutes

          echo "Waiting for Vercel preview to go ready for SHA $SHORT_SHA..."

          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            # Ask Vercel for the latest deployments and pick the one that matches
            # this SHA. --token is read from the env var VERCEL_TOKEN.
            DEPLOYMENTS_JSON=$(npx --yes vercel@latest list --json --token "$VERCEL_TOKEN" 2>/dev/null || echo "[]")

            # Fallback to the plain text `ls` output when --json isn't supported
            # by the installed CLI.
            if [ "$DEPLOYMENTS_JSON" = "[]" ] || [ -z "$DEPLOYMENTS_JSON" ]; then
              LINE=$(npx --yes vercel@latest ls --token "$VERCEL_TOKEN" 2>/dev/null \
                | grep -F "$SHORT_SHA" \
                | grep -E "Ready" \
                | head -n 1 || true)
              if [ -n "$LINE" ]; then
                URL=$(echo "$LINE" | awk '{for(i=1;i<=NF;i++) if ($i ~ /^https:\/\//) print $i}' | head -n 1)
                if [ -n "$URL" ]; then
                  echo "Found ready preview: $URL"
                  echo "preview_url=$URL" >> "$GITHUB_OUTPUT"
                  exit 0
                fi
              fi
            else
              URL=$(echo "$DEPLOYMENTS_JSON" \
                | jq -r --arg sha "$SHA" '
                    .deployments // . | map(select(
                      (.meta.githubCommitSha // "") == $sha
                      and (.state == "READY" or .readyState == "READY")
                    )) | .[0].url // empty')
              if [ -n "$URL" ] && [ "$URL" != "null" ]; then
                PROTO_URL="https://$URL"
                echo "Found ready preview: $PROTO_URL"
                echo "preview_url=$PROTO_URL" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi

            echo "Preview not ready yet, sleeping 20s..."
            sleep 20
          done

          echo "::error::Vercel preview for SHA $SHORT_SHA did not become Ready within 10 minutes. Check the Vercel dashboard for build failures."
          exit 1

      - name: Verify verify-autopilot.sh exists
        run: |
          if [ ! -x scripts/verify-autopilot.sh ]; then
            echo "::error::scripts/verify-autopilot.sh is missing or not executable. This workflow depends on P2.7 being landed first."
            exit 1
          fi

      - name: Prepare log + secret directories
        run: |
          mkdir -p "$HOME/Developer/forgeos-autopilot-logs"
          mkdir -p "$HOME/.claude/secrets"
          # The script reads credentials from the env file convention used in
          # local dev. Writing it into a chmod 600 file keeps the pattern
          # identical between CI and local runs.
          ENV_FILE="$HOME/.claude/secrets/forgeos-test.env"
          {
            echo "FORGEOS_TEST_EMAIL=$FORGEOS_TEST_EMAIL"
            echo "FORGEOS_TEST_PASSWORD=$FORGEOS_TEST_PASSWORD"
          } > "$ENV_FILE"
          chmod 600 "$ENV_FILE"

      - name: Run verify-autopilot.sh
        id: verify
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
          FORGEOS_TEST_URL: ${{ steps.preview.outputs.preview_url }}
          SMOKE_SUBJECT: ${{ github.event.inputs.subject_override }}
          TIMEOUT_TOTAL_MS: "1500000"
        run: |
          set -o pipefail
          SUBJECT="${SMOKE_SUBJECT:-$SMOKE_SUBJECT_DEFAULT}"
          LOG_FILE="/tmp/verify-autopilot-${{ github.run_id }}.log"
          echo "Preview URL: $PREVIEW_URL"
          echo "Subject: $SUBJECT"
          echo "Logging to: $LOG_FILE"
          bash scripts/verify-autopilot.sh "$SUBJECT" 2>&1 | tee "$LOG_FILE"

      - name: Upload autopilot logs on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autopilot-smoke-logs-${{ github.run_id }}
          path: |
            /tmp/verify-autopilot-*.log
            ~/Developer/forgeos-autopilot-logs/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Summarise run
        if: always()
        env:
          PREVIEW_URL_OUT: ${{ steps.preview.outputs.preview_url }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          {
            printf '## Autopilot smoke test\n\n'
            printf -- '- **SHA:** `%s`\n' "$GITHUB_SHA"
            printf -- '- **Branch / ref:** `%s`\n' "$GITHUB_REF"
            printf -- '- **Preview URL:** %s\n' "${PREVIEW_URL_OUT:-(not resolved)}"
            printf -- '- **Verify step outcome:** %s\n' "${VERIFY_OUTCOME:-not run}"
            printf '\nLogs are attached as workflow artifacts (`autopilot-smoke-logs-%s`).\n' "$GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"
