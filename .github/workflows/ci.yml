name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"

      - name: Lint
        run: npm run lint

  # Engine regression guards (Tristan 2026-06-24, CORE FIX PRINCIPLE enforcement). The same gate
  # as .husky/pre-push, but server-side where `git push --no-verify` cannot skip it — the
  # un-bypassable enforcement of "every fix carries a guard that can't regress". Runs every engine
  # --selftest (the rule-level pricing/sizing/contract guards); fails the build on any regression.
  engine-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Engine regression guards (every --selftest; blocks a regressed source rule)
        run: npm run verify:engine
