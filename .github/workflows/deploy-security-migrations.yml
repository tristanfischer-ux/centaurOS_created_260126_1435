name: Deploy Security Supabase Migrations

on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: 'Supabase project ref (defaults to repo-linked ref)'
        required: false
        default: ''
      generate_types:
        description: 'Regenerate database types after migration deploy'
        required: false
        default: false
        type: boolean

jobs:
  deploy-security-migrations:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate required Supabase secrets
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "SUPABASE_ACCESS_TOKEN is required." >&2
            exit 1
          fi

          if [ -z "${SUPABASE_DB_PASSWORD}" ]; then
            echo "SUPABASE_DB_PASSWORD is required." >&2
            exit 1
          fi

      - name: Deploy security migrations and verify remote versions
        run: |
          PROJECT_ARG=""
          if [ -n "${{ inputs.project_ref }}" ]; then
            PROJECT_ARG="--project-ref ${{ inputs.project_ref }}"
          fi

          GENERATE_ARG=""
          if [ "${{ inputs.generate_types }}" = "true" ]; then
            GENERATE_ARG="--generate-types"
          fi

          ./scripts/deploy-security-migrations.sh ${PROJECT_ARG} ${GENERATE_ARG}
