name: Backfill STL from STEP Templates

on:
  # Run automatically after the upload script seeds new templates
  workflow_dispatch:
    inputs:
      limit:
        description: "Max templates to process (0 = all)"
        required: false
        default: "0"
        type: string
      tolerance:
        description: "STL mesh tolerance in mm"
        required: false
        default: "0.1"
        type: string
      dry_run:
        description: "Dry run (count only, don't convert)"
        required: false
        default: false
        type: boolean

  # Nightly at 3am UTC — catches any templates uploaded during the day
  schedule:
    - cron: "0 3 * * *"

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install supabase

      - name: Run STL backfill
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MODAL_CAD_ENDPOINT_URL: ${{ secrets.MODAL_CAD_ENDPOINT_URL }}
        run: |
          ARGS=""
          if [ "${{ inputs.limit || '0' }}" != "0" ]; then
            ARGS="$ARGS --limit ${{ inputs.limit }}"
          fi
          if [ "${{ inputs.tolerance || '0.1' }}" != "0.1" ]; then
            ARGS="$ARGS --tolerance ${{ inputs.tolerance }}"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python scripts/ci-backfill-stl.py $ARGS
