<text x="900" y="192" class="t xs">IF-HV · HV DC + HVIL · Inverter shelf · OPEN chassis XYZ</text>
<text x="900" y="210" class="t xs">IF-CL-IN · Coolant supply QD · Motor jacket · 60 °C design inlet</text>
