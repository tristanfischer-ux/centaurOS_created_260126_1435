<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" role="img" aria-label="Stratosphere HAPS-S1 — concept render showing the aircraft in flight at FL650 over the Earth limb">
  <defs>
    <!-- Sky gradient from deep stratosphere to atmospheric scatter -->
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.35" stop-color="#0a2452"/>
      <stop offset="0.62" stop-color="#1e3a8a"/>
      <stop offset="0.82" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#bae6fd"/>
    </linearGradient>
    <!-- Earth limb -->
    <linearGradient id="earth" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="0.4" stop-color="#0c4a6e"/>
      <stop offset="1" stop-color="#064e3b"/>
    </linearGradient>
    <!-- Solar-cell blue-black -->
    <linearGradient id="solar" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#0c1e3e"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <!-- Wing top highlight -->
    <linearGradient id="wingTop" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.55" stop-color="#cbd5e1"/>
      <stop offset="1" stop-color="#64748b"/>
    </linearGradient>
    <!-- Wing bottom shadow -->
    <linearGradient id="wingBottom" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#64748b"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <!-- Pod shading -->
    <linearGradient id="pod" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#e2e8f0"/>
      <stop offset="0.5" stop-color="#94a3b8"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <!-- Propeller blur -->
    <radialGradient id="propBlur" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e2e8f0" stop-opacity="0.75"/>
      <stop offset="0.7" stop-color="#cbd5e1" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#94a3b8" stop-opacity="0"/>
    </radialGradient>
    <!-- Contrail -->
    <linearGradient id="trail" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#fafafa" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fafafa" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- sky -->
  <rect width="1600" height="960" fill="url(#sky)"/>

  <!-- distant stars in the stratosphere -->
  <g fill="#f8fafc" opacity="0.55">
    <circle cx="120"  cy="80"  r="1.1"/>
    <circle cx="260"  cy="150" r="0.8"/>
    <circle cx="420"  cy="60"  r="1.4"/>
    <circle cx="560"  cy="120" r="0.9"/>
    <circle cx="700"  cy="70"  r="1.0"/>
    <circle cx="830"  cy="160" r="1.2"/>
    <circle cx="980"  cy="45"  r="0.8"/>
    <circle cx="1120" cy="110" r="1.1"/>
    <circle cx="1260" cy="70"  r="0.9"/>
    <circle cx="1400" cy="150" r="1.2"/>
    <circle cx="1520" cy="40"  r="1.0"/>
  </g>

  <!-- Earth limb, curving across the bottom -->
  <path d="M -40 900 Q 800 640 1640 900 L 1640 1000 L -40 1000 Z" fill="url(#earth)"/>
  <!-- Atmospheric scatter line -->
  <path d="M -40 900 Q 800 640 1640 900" fill="none" stroke="#bae6fd" stroke-width="3" opacity="0.7"/>
  <path d="M -40 900 Q 800 640 1640 900" fill="none" stroke="#f0f9ff" stroke-width="1" opacity="0.9"/>

  <!-- Cloud layer (distant, far below aircraft) -->
  <g opacity="0.65" fill="#f0f9ff">
    <ellipse cx="240"  cy="820" rx="200" ry="18"/>
    <ellipse cx="640"  cy="840" rx="260" ry="22"/>
    <ellipse cx="1100" cy="810" rx="240" ry="20"/>
    <ellipse cx="1440" cy="830" rx="180" ry="16"/>
  </g>

  <!-- Contrail (aircraft at FL650 — tiny on the scale) -->
  <path d="M 120 540 Q 460 555 820 560 L 1200 558" stroke="url(#trail)" stroke-width="14" fill="none" stroke-linecap="round"/>
  <path d="M 120 540 Q 460 555 820 560 L 1200 558" stroke="#fafafa" stroke-width="2" fill="none" opacity="0.45" stroke-linecap="round"/>

  <!-- ═════════ AIRCRAFT (3/4 rear view) ═════════ -->
  <g transform="translate(820, 430) rotate(-2)">

    <!-- Wing bottom (shadow) -->
    <path d="M -620 18 Q -300 34 0 44 Q 300 34 620 18 L 620 30 Q 300 44 0 56 Q -300 44 -620 30 Z"
          fill="url(#wingBottom)"/>

    <!-- Wing top surface with 9 solar-cell strings -->
    <path d="M -620 8 Q -300 -2 0 -14 Q 300 -2 620 8 L 620 20 Q 300 8 0 -6 Q -300 8 -620 20 Z"
          fill="url(#wingTop)"/>
    <!-- solar strings -->
    <g fill="url(#solar)" opacity="0.92">
      <rect x="-580" y="-3"  width="110" height="15" rx="1"/>
      <rect x="-450" y="-6"  width="110" height="17" rx="1"/>
      <rect x="-320" y="-9"  width="110" height="19" rx="1"/>
      <rect x="-190" y="-12" width="110" height="21" rx="1"/>
      <rect x="-58"  y="-14" width="116" height="22" rx="1"/>
      <rect x="80"   y="-12" width="110" height="21" rx="1"/>
      <rect x="210"  y="-9"  width="110" height="19" rx="1"/>
      <rect x="340"  y="-6"  width="110" height="17" rx="1"/>
      <rect x="470"  y="-3"  width="110" height="15" rx="1"/>
    </g>
    <!-- Cell interconnect lines -->
    <g stroke="#3b82f6" stroke-width="0.5" opacity="0.45">
      <line x1="-580" y1="5" x2="580" y2="5"/>
    </g>

    <!-- Winglets -->
    <path d="M -620 8 L -650 -22 L -648 -4 L -620 18 Z" fill="url(#wingTop)"/>
    <path d="M 620 8 L 650 -22 L 648 -4 L 620 18 Z" fill="url(#wingTop)"/>

    <!-- Propulsion pods -->
    <!-- Port pod -->
    <g transform="translate(-210, 48)">
      <ellipse cx="0" cy="0" rx="48" ry="16" fill="url(#pod)"/>
      <ellipse cx="38" cy="0" rx="12" ry="14" fill="#0f172a"/>
      <!-- Prop disc (motion blur) -->
      <circle cx="-42" cy="0" r="44" fill="url(#propBlur)" filter="url(#softGlow)"/>
      <circle cx="-42" cy="0" r="42" fill="none" stroke="#cbd5e1" stroke-width="0.5" opacity="0.65"/>
      <!-- hub -->
      <circle cx="-42" cy="0" r="3" fill="#1e293b"/>
    </g>
    <!-- Starboard pod -->
    <g transform="translate(210, 48)">
      <ellipse cx="0" cy="0" rx="48" ry="16" fill="url(#pod)"/>
      <ellipse cx="38" cy="0" rx="12" ry="14" fill="#0f172a"/>
      <circle cx="-42" cy="0" r="44" fill="url(#propBlur)" filter="url(#softGlow)"/>
      <circle cx="-42" cy="0" r="42" fill="none" stroke="#cbd5e1" stroke-width="0.5" opacity="0.65"/>
      <circle cx="-42" cy="0" r="3" fill="#1e293b"/>
    </g>

    <!-- Fuselage -->
    <path d="M -50 -30 Q -30 -46 0 -48 Q 30 -46 50 -30 L 50 54 Q 30 74 0 76 Q -30 74 -50 54 Z"
          fill="url(#pod)"/>
    <!-- Fuselage highlight stripe -->
    <path d="M -42 -20 Q -22 -38 0 -40 Q 22 -38 42 -20" fill="none" stroke="#f8fafc" stroke-width="1.2" opacity="0.6"/>
    <!-- Avionics port -->
    <rect x="-10" y="10" width="20" height="14" rx="2" fill="#0c1e3e" opacity="0.7"/>
    <!-- Payload bay door -->
    <rect x="-14" y="32" width="28" height="22" rx="2" fill="none" stroke="#475569" stroke-width="0.5"/>

    <!-- V-tail -->
    <path d="M 0 72 L -58 138 L -48 142 L 0 96 L 48 142 L 58 138 Z" fill="url(#pod)"/>
    <line x1="-34" y1="138" x2="34" y2="138" stroke="#475569" stroke-width="0.4" stroke-dasharray="2 3"/>
  </g>

  <!-- Bottom info bar — subtle, photo-caption style -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" fill="#f8fafc" opacity="0.85">
    <rect x="0" y="908" width="1600" height="52" fill="#0f172a" opacity="0.55"/>
    <text x="40" y="938" font-size="13" letter-spacing="0.05em">STRATOSPHERE · HAPS-S1 · FL650 · 30-DAY ENDURANCE</text>
    <text x="1560" y="938" text-anchor="end" font-size="12" opacity="0.75">CONCEPT RENDER · REV A</text>
  </g>
</svg>
