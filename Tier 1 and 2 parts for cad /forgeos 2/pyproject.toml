[project]
name = "forgeos"
version = "0.1.0"
description = "Domain Pattern Library for parametric product design"
requires-python = ">=3.10"
dependencies = [
    "cadquery>=2.4",
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
include = ["core*", "grammars*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
