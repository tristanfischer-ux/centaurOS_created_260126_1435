<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Stratosphere HAPS-S1 — blueprint concept illustration (plan view and side elevation)">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#21457a" stroke-width="0.4"/>
    </pattern>
    <pattern id="gridMajor" width="200" height="200" patternUnits="userSpaceOnUse">
      <path d="M 200 0 L 0 0 0 200" fill="none" stroke="#2f5a9a" stroke-width="0.8"/>
    </pattern>
    <linearGradient id="paper" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#0b2a55"/>
      <stop offset="1" stop-color="#082548"/>
    </linearGradient>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#e6f0ff"/>
    </marker>
  </defs>

  <!-- paper + grids -->
  <rect width="1600" height="1000" fill="url(#paper)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <rect width="1600" height="1000" fill="url(#gridMajor)"/>
  <rect x="16" y="16" width="1568" height="968" fill="none" stroke="#5d86c2" stroke-width="1.1"/>
  <rect x="28" y="28" width="1544" height="944" fill="none" stroke="#b8d0f2" stroke-width="0.6" stroke-dasharray="2 4"/>

  <!-- title / top-corner block -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#e6f0ff">
    <text x="60" y="68" font-size="22" letter-spacing="1.6">STRATOSPHERE · HAPS-S1</text>
    <text x="60" y="92" font-size="12" letter-spacing="1.4" fill="#a7c2ea">PLAN VIEW + SIDE ELEVATION · SCALE 1:100 · REV A · LOCKED</text>
    <text x="60" y="112" font-size="10.5" letter-spacing="1.2" fill="#7ca3d6">SPEC: 25.0 m SPAN · 42 m² SOLAR · 68.0 kg MTOW · FL650 · 30-DAY ENDURANCE</text>
  </g>

  <!-- ═════════ PLAN VIEW (top) ═════════ -->
  <g transform="translate(800, 370)">
    <!-- centreline -->
    <line x1="-720" y1="0" x2="720" y2="0" stroke="#6ca1e0" stroke-width="0.6" stroke-dasharray="3 5"/>

    <!-- wing — swept box-spar outline -->
    <path d="M -720 -8 L -640 -14 L -80 -22 L 0 -36 L 80 -22 L 640 -14 L 720 -8 L 720 18 L 640 22 L 80 30 L 0 44 L -80 30 L -640 22 L -720 18 Z"
          fill="rgba(134,180,232,0.10)" stroke="#dbe8fb" stroke-width="1.6" stroke-linejoin="round"/>

    <!-- solar array segments — 9 strings on upper surface -->
    <g stroke="#7ac3ff" stroke-width="0.9" opacity="0.7">
      <line x1="-600" y1="-20" x2="-600" y2="18"/>
      <line x1="-450" y1="-20" x2="-450" y2="18"/>
      <line x1="-300" y1="-22" x2="-300" y2="22"/>
      <line x1="-150" y1="-24" x2="-150" y2="28"/>
      <line x1="0"    y1="-36" x2="0"    y2="44"/>
      <line x1="150"  y1="-24" x2="150"  y2="28"/>
      <line x1="300"  y1="-22" x2="300"  y2="22"/>
      <line x1="450"  y1="-20" x2="450"  y2="18"/>
      <line x1="600"  y1="-20" x2="600"  y2="18"/>
    </g>

    <!-- ribs -->
    <g stroke="#6ca1e0" stroke-width="0.5" opacity="0.55">
      <line x1="-700" y1="-12" x2="-700" y2="16"/>
      <line x1="-550" y1="-18" x2="-550" y2="20"/>
      <line x1="-400" y1="-20" x2="-400" y2="20"/>
      <line x1="-250" y1="-22" x2="-250" y2="24"/>
      <line x1="-100" y1="-24" x2="-100" y2="30"/>
      <line x1="100"  y1="-24" x2="100"  y2="30"/>
      <line x1="250"  y1="-22" x2="250"  y2="24"/>
      <line x1="400"  y1="-20" x2="400"  y2="20"/>
      <line x1="550"  y1="-18" x2="550"  y2="20"/>
      <line x1="700"  y1="-12" x2="700"  y2="16"/>
    </g>

    <!-- winglets -->
    <path d="M -720 -8 L -740 -22 L -740 18 L -720 18" fill="none" stroke="#dbe8fb" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M 720 -8 L 740 -22 L 740 18 L 720 18" fill="none" stroke="#dbe8fb" stroke-width="1.4" stroke-linejoin="round"/>

    <!-- propulsion pods -->
    <g>
      <ellipse cx="-240" cy="60" rx="40" ry="14" fill="rgba(134,180,232,0.18)" stroke="#dbe8fb" stroke-width="1.3"/>
      <!-- prop disc -->
      <circle cx="-300" cy="60" r="28" fill="none" stroke="#7ac3ff" stroke-width="0.9" stroke-dasharray="3 4"/>
      <line x1="-300" y1="32" x2="-300" y2="88" stroke="#7ac3ff" stroke-width="0.7"/>
      <line x1="-328" y1="60" x2="-272" y2="60" stroke="#7ac3ff" stroke-width="0.7"/>

      <ellipse cx="240" cy="60" rx="40" ry="14" fill="rgba(134,180,232,0.18)" stroke="#dbe8fb" stroke-width="1.3"/>
      <circle cx="300" cy="60" r="28" fill="none" stroke="#7ac3ff" stroke-width="0.9" stroke-dasharray="3 4"/>
      <line x1="300" y1="32" x2="300" y2="88" stroke="#7ac3ff" stroke-width="0.7"/>
      <line x1="272" y1="60" x2="328" y2="60" stroke="#7ac3ff" stroke-width="0.7"/>
    </g>

    <!-- fuselage -->
    <path d="M -60 -44 Q -30 -56 0 -58 Q 30 -56 60 -44 L 60 52 Q 30 66 0 68 Q -30 66 -60 52 Z"
          fill="rgba(134,180,232,0.22)" stroke="#e6f0ff" stroke-width="1.6"/>
    <!-- tank + avionics bay -->
    <rect x="-22" y="-28" width="44" height="34" fill="none" stroke="#7ac3ff" stroke-width="0.7" stroke-dasharray="2 3"/>
    <rect x="-24" y="12" width="48" height="42" fill="none" stroke="#7ac3ff" stroke-width="0.7" stroke-dasharray="2 3"/>
    <circle cx="0" cy="-10" r="10" fill="none" stroke="#7ac3ff" stroke-width="0.7"/>

    <!-- V-tail -->
    <path d="M 0 64 L -56 122 L -44 122 L 0 84 L 44 122 L 56 122 Z" fill="rgba(134,180,232,0.18)" stroke="#dbe8fb" stroke-width="1.4" stroke-linejoin="round"/>

    <!-- span dimension -->
    <g stroke="#e6f0ff" stroke-width="0.8">
      <line x1="-740" y1="-80" x2="740" y2="-80" marker-start="url(#arrowhead)" marker-end="url(#arrowhead)"/>
      <line x1="-740" y1="-88" x2="-740" y2="-72"/>
      <line x1="740" y1="-88" x2="740" y2="-72"/>
    </g>
    <text x="0" y="-88" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#e6f0ff">25.00 m</text>

    <!-- pod callouts -->
    <text x="-300" y="110" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#a7c2ea">PORT POD · 4 kW FC · 9.2 kW motor</text>
    <text x="300" y="110" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#a7c2ea">STBD POD · 4 kW FC · 9.2 kW motor</text>

    <!-- section label -->
    <text x="-720" y="-52" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1.5" fill="#7ca3d6">A · PLAN VIEW</text>
  </g>

  <!-- ═════════ SIDE ELEVATION (bottom) ═════════ -->
  <g transform="translate(800, 780)">
    <line x1="-720" y1="0" x2="720" y2="0" stroke="#6ca1e0" stroke-width="0.6" stroke-dasharray="3 5"/>

    <!-- fuselage profile -->
    <path d="M -60 -12 Q -40 -20 0 -22 Q 40 -20 60 -16 L 58 16 Q 40 24 0 26 Q -40 24 -60 20 Z"
          fill="rgba(134,180,232,0.20)" stroke="#e6f0ff" stroke-width="1.4"/>

    <!-- wing as thin line from fuselage -->
    <line x1="-700" y1="-4" x2="-60" y2="-8" stroke="#dbe8fb" stroke-width="1.6"/>
    <line x1="60" y1="-8" x2="700" y2="-4" stroke="#dbe8fb" stroke-width="1.6"/>
    <line x1="-700" y1="2" x2="-60" y2="0" stroke="#dbe8fb" stroke-width="1.0"/>
    <line x1="60" y1="0" x2="700" y2="2" stroke="#dbe8fb" stroke-width="1.0"/>

    <!-- propulsion pod side (port) -->
    <ellipse cx="-240" cy="18" rx="48" ry="10" fill="rgba(134,180,232,0.22)" stroke="#dbe8fb" stroke-width="1.1"/>
    <line x1="-300" y1="18" x2="-300" y2="46" stroke="#6ca1e0" stroke-width="0.6" stroke-dasharray="2 3"/>
    <ellipse cx="240" cy="18" rx="48" ry="10" fill="rgba(134,180,232,0.22)" stroke="#dbe8fb" stroke-width="1.1"/>
    <line x1="300" y1="18" x2="300" y2="46" stroke="#6ca1e0" stroke-width="0.6" stroke-dasharray="2 3"/>

    <!-- V-tail (side) -->
    <path d="M 60 -16 L 180 -48 L 195 -46 L 80 -10" fill="none" stroke="#dbe8fb" stroke-width="1.2"/>
    <path d="M 180 -48 L 180 -20 L 195 -20 L 195 -46" fill="none" stroke="#7ac3ff" stroke-width="0.6" stroke-dasharray="2 3"/>

    <!-- landing / launch skid -->
    <line x1="-10" y1="28" x2="10" y2="28" stroke="#dbe8fb" stroke-width="1.2"/>
    <line x1="-16" y1="34" x2="-10" y2="28" stroke="#dbe8fb" stroke-width="1.2"/>
    <line x1="16" y1="34" x2="10" y2="28" stroke="#dbe8fb" stroke-width="1.2"/>

    <!-- ground -->
    <line x1="-720" y1="70" x2="720" y2="70" stroke="#4c7abf" stroke-width="0.5" stroke-dasharray="4 6"/>

    <!-- height dim -->
    <g stroke="#e6f0ff" stroke-width="0.8">
      <line x1="-700" y1="70" x2="-700" y2="-22" marker-start="url(#arrowhead)" marker-end="url(#arrowhead)"/>
    </g>
    <text x="-720" y="20" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#e6f0ff" text-anchor="end">1.95 m</text>

    <text x="-720" y="-60" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1.5" fill="#7ca3d6">B · SIDE ELEVATION</text>
    <text x="720" y="-60" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#7ca3d6">PROP DIA 2.40 m · TAIL HT 0.48 m</text>
  </g>

  <!-- title block bottom-right -->
  <g transform="translate(1260, 840)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#e6f0ff">
    <rect x="0" y="0" width="300" height="120" fill="rgba(9,33,63,0.8)" stroke="#5d86c2" stroke-width="0.8"/>
    <text x="12" y="20" font-size="10" letter-spacing="1.2" fill="#a7c2ea">FRACTIONAL FORGE · FORGEOS</text>
    <text x="12" y="40" font-size="14" letter-spacing="1.6">HAPS-S1 · STRATOSPHERE</text>
    <text x="12" y="58" font-size="9.5" letter-spacing="1.1" fill="#a7c2ea">DWG · FF-HAPS-S1-PLN-001</text>
    <text x="12" y="74" font-size="9.5" letter-spacing="1.1" fill="#a7c2ea">REV · A  (2026-04-16)</text>
    <text x="12" y="90" font-size="9.5" letter-spacing="1.1" fill="#a7c2ea">SCALE · 1:100  SHEET · 01/03</text>
    <text x="12" y="106" font-size="9.5" letter-spacing="1.1" fill="#a7c2ea">CLAUDE TEST FOUNDRY</text>
  </g>

  <!-- small north indicator -->
  <g transform="translate(1480, 280)">
    <circle cx="0" cy="0" r="22" fill="none" stroke="#b8d0f2" stroke-width="0.7"/>
    <polygon points="0,-16 4,0 0,-4 -4,0" fill="#e6f0ff"/>
    <text x="0" y="38" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#a7c2ea">FLIGHT DIR.</text>
  </g>
</svg>
