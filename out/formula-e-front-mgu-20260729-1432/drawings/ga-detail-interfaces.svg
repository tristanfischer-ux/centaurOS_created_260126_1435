<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1400" viewBox="0 0 1800 1400">
<title>FE Front — Interface ICD (detailed)</title>
<rect width="100%" height="100%" fill="#fafafa"/>
<style>
  .t { font-family: Helvetica, Arial, sans-serif; fill: #111; }
  .h { font-size: 18px; font-weight: 700; }
  .s { font-size: 11px; }
  .xs { font-size: 9px; fill: #333; }
  .dim { font-size: 10px; fill: #0a3d91; }
  .warn { fill: #a30; font-size: 10px; }
  .box { fill: none; stroke: #1a1a1a; stroke-width: 1.4; }
  .cyl { fill: #e8eef5; stroke: #1a1a1a; stroke-width: 1.3; }
  .pe { fill: #dfe8d8; stroke: #1a1a1a; stroke-width: 1.2; }
  .hv { fill: #ff8c00; stroke: #333; stroke-width: 1; }
  .cool { fill: #c8e0f0; stroke: #1a4a6a; stroke-width: 1; }
  .axis { stroke: #888; stroke-dasharray: 4 3; stroke-width: 0.8; }
  .leader { stroke: #0a3d91; stroke-width: 0.9; }
</style>
<text x="40" y="36" class="t h">INTERFACE CONTROL — connectors, QD, HV (from Blender train)</text>
<text x="40" y="58" class="t s">Service face toward vehicle cooling corridor · chassis XYZ remains OPEN until partner ICD</text>
<rect x="80" y="120" width="700" height="500" class="box" fill="#f0f0f0"/>
<text x="90" y="144" class="t s">SERVICE FACE (toward front bay)</text>
<rect x="120" y="200" width="160" height="50" class="hv"/>
<text x="130" y="230" class="t xs">HV DC connector + HVIL</text>
<line x1="280" y1="225" x2="400" y2="225" class="leader"/>
<text x="405" y="228" class="t xs">X-HV · orange safety collar · braid boot</text>
<circle cx="200" cy="340" r="22" class="cool"/>
<circle cx="280" cy="340" r="22" fill="#e8a0a0" stroke="#6a1a1a"/>
<text x="170" y="390" class="t xs">coolant IN (blue) / OUT (red) · X-147 / X-148</text>
<rect x="120" y="440" width="100" height="36" fill="#333" stroke="#111"/>
<text x="130" y="462" class="t xs" fill="#eee">LV / CAN</text>
<text x="240" y="462" class="t xs">vehicle CAN-FD · interlock</text>
<rect x="160" y="580" width="40" height="18" fill="#555"/>
<rect x="360" y="580" width="40" height="18" fill="#555"/>
<rect x="560" y="580" width="40" height="18" fill="#555"/>
<rect x="700" y="580" width="40" height="18" fill="#555"/>
